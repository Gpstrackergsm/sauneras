<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <!-- Sauna box icon -->
  <g transform="translate(4, 8)">
    <!-- Box body -->
    <rect x="8" y="28" width="48" height="36" rx="3" fill="#FAF7F2"/>
    <!-- Wood slats -->
    <line x1="8" y1="37" x2="56" y2="37" stroke="#d4cfc8" stroke-width="1.5"/>
    <line x1="8" y1="46" x2="56" y2="46" stroke="#d4cfc8" stroke-width="1.5"/>
    <line x1="8" y1="55" x2="56" y2="55" stroke="#d4cfc8" stroke-width="1.5"/>
    <!-- Door handle -->
